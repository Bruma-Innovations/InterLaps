<div class="leader-card" >
  <div class="card-content">
    <div class="text-section">
      <p class="round-info">Mejor Resultado en Carrera </p>
      <h2 class="name"><span>{{driverInfo.name}}</span> {{driverInfo.lastName}}</h2>
      <p class="team">{{driverInfo.team}}</p>
      <p class="points">{{driverInfo.points}}</p>
    </div>
    <div class="image-container">
      <img src="assets/svg/race/flag.svg" alt="Kimmi" />
    </div>
  </div>
</div>
